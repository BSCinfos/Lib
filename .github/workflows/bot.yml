name: Bot Minerador do Brawl Stars

on:
  schedule:
    # Roda a cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Evita duas execuções simultâneas tentando alterar os mesmos arquivos.
concurrency:
  group: bscinfos-bot-minerador
  cancel-in-progress: false

jobs:
  minerar_e_atualizar:
    # IMPORTANTE: este runner precisa estar instalado em uma máquina cuja saída
    # pública para a internet seja realmente 20.169.69.129.
    runs-on: [self-hosted, linux, x64]
    env:
      TZ: 'America/Sao_Paulo'
      BRAWL_STARS_API_KEY: ${{ secrets.BRAWL_STARS_API_KEY }}
    permissions:
      contents: write

    steps:
      - name: Baixando os arquivos do repositório
        uses: actions/checkout@v4

      - name: Verificar IP público autorizado
        shell: bash
        run: |
          set -euo pipefail
          IP=$(curl -4 -fsS --max-time 10 https://api.ipify.org || true)
          if [ -z "$IP" ]; then
            IP=$(curl -4 -fsS --max-time 10 https://ifconfig.me/ip || true)
          fi

          IP_AUTORIZADO="20.169.69.129"
          echo "=========================================="
          echo "IP PÚBLICO DO RUNNER: ${IP:-Não foi possível obter o IP}"
          echo "IP AUTORIZADO: ${IP_AUTORIZADO}"
          echo "=========================================="

          if [ -z "$IP" ]; then
            echo "ERRO: não foi possível verificar o IP público. Execução interrompida."
            exit 1
          fi

          if [ "$IP" != "$IP_AUTORIZADO" ]; then
            echo "ERRO: o runner não está saindo pelo IP fixo autorizado."
            echo "Configure a rede/saída pública do servidor para usar ${IP_AUTORIZADO}."
            exit 1
          fi

          echo "IP autorizado. Continuando o workflow."

      - name: Instalando o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalando as bibliotecas
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas brawlstats requests

      - name: Sincronizar e Configurar Git
        shell: bash
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - name: Validar chave da Brawl Stars API
        shell: bash
        run: |
          if [ -z "$BRAWL_STARS_API_KEY" ]; then
            echo "ERRO: configure o Secret BRAWL_STARS_API_KEY no repositório."
            exit 1
          fi
          echo "Secret BRAWL_STARS_API_KEY configurado."

      - name: Rodando o Gerador (Bot)
        run: python gerador.py

      - name: Salvando as alterações no GitHub
        shell: bash
        run: |
          git add historico_bruto.csv estatisticas_finais.csv rosters.json api/

          if ! git diff --cached --quiet; then
            git commit -m "🤖 Atualização Automática de Partidas e Rosters"
            git push origin main
          else
            echo "Sem mudanças para atualizar"
          fi
